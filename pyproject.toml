[build-system]
requires = ["flit_core >=3.11,<5"]
build-backend = "flit_core.buildapi"

[project]
name = "acmeerkat"
authors = [
    {name = "Vitalik Verhovodov", email = "knifeslaughter@gmail.com"}
]
description = "ACME client as a library"
requires-python = ">=3.12"
version = "0.2.0"
license = "MIT"
keywords = ["acme", "letsencrypt"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Topic :: Internet",
    "Topic :: Utilities",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/neumond/acmeerkat.git"

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
