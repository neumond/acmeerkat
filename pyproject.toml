[build-system]
requires = ["flit_core >=3.11,<5"]
build-backend = "flit_core.buildapi"

[project]
name = "acmeerkat"
authors = [
    {name = "Vitalik Verhovodov", email = "knifeslaughter@gmail.com"}
]
home-page = "https://github.com/neumond/acmeerkat"
requires-python = ">=3.12"
version = "0.1.0"
license = "MIT"
keywords = "acme,letsencrypt"

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
